---
- name: Install PXE build packages
  ansible.builtin.apt:
    name: "{{ build_vm_packages }}"
    state: present

- name: Ensure PXE directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ pxe_root }}"
    - "{{ tftp_root }}"
    - "{{ tftp_root }}/pxelinux.cfg"
    - "{{ pxe_root }}/images"
    - "{{ pxe_root }}/artifacts"
    - "{{ pxe_root }}/definitions"
    - "{{ pxe_root }}/debug"
    - "{{ pxe_server_debug_root }}"
    - "{{ pxe_server_definitions_publish_dir }}"
    - "{{ pxe_server_workspace }}"
    - "{{ pxe_server_livebuild_root }}"
    - "{{ pxe_server_client_publish_dir }}"
    - "{{ pxe_server_boot_nfs_root }}"
    - "{{ pxe_server_tftp_client_publish_dir }}"
    - "{{ pxe_server_maintenance_log_root }}"

- name: Ensure NFS exports drop-in directory exists
  ansible.builtin.file:
    path: /etc/exports.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render PXE lab netplan
  ansible.builtin.template:
    src: 60-av-pxe-lab.yaml.j2
    dest: /etc/netplan/60-av-pxe-lab.yaml
    owner: root
    group: root
    mode: "0644"
  register: build_vm_pxe_lab_netplan

- name: Render dnsmasq configuration
  ansible.builtin.template:
    src: dnsmasq-av-build.conf.j2
    dest: /etc/dnsmasq.d/av-build.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart dnsmasq

- name: Render PXE menu
  ansible.builtin.template:
    src: pxelinux-default.j2
    dest: "{{ pxe_menu_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Render iPXE boot script
  ansible.builtin.template:
    src: boot.ipxe.j2
    dest: "{{ tftp_root }}/boot.ipxe"
    owner: root
    group: root
    mode: "0644"

- name: Publish BIOS PXE bootloader files into TFTP root
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: /usr/lib/PXELINUX/pxelinux.0
      dest: "{{ tftp_root }}/pxelinux.0"
    - src: /usr/lib/syslinux/modules/bios/ldlinux.c32
      dest: "{{ tftp_root }}/ldlinux.c32"
    - src: /usr/lib/syslinux/modules/bios/libcom32.c32
      dest: "{{ tftp_root }}/libcom32.c32"
    - src: /usr/lib/syslinux/modules/bios/libutil.c32
      dest: "{{ tftp_root }}/libutil.c32"
    - src: /usr/lib/syslinux/modules/bios/menu.c32
      dest: "{{ tftp_root }}/menu.c32"
    - src: /usr/lib/ipxe/undionly.kpxe
      dest: "{{ tftp_root }}/undionly.kpxe"
    - src: /usr/lib/ipxe/snponly.efi
      dest: "{{ tftp_root }}/snponly.efi"

- name: Render nginx site for PXE artifacts
  ansible.builtin.template:
    src: nginx-av-build.conf.j2
    dest: /etc/nginx/sites-available/{{ nginx_site_name }}.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Allow nginx AppArmor profile to read PXE artifact tree
  ansible.builtin.template:
    src: usr.sbin.nginx.local.j2
    dest: /etc/apparmor.d/local/usr.sbin.nginx
    owner: root
    group: root
    mode: "0644"
  notify: Reload apparmor

- name: Enable nginx build site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_site_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ nginx_site_name }}.conf"
    state: link
  notify: Reload nginx

- name: Disable default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure build services are enabled and running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - dnsmasq
    - nginx
    - tftpd-hpa
    - nfs-kernel-server

- name: Render PXE NFS export
  ansible.builtin.template:
    src: av-pxe.exports.j2
    dest: /etc/exports.d/av-pxe.exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload nfs exports

- name: Install PXE debug collector
  ansible.builtin.template:
    src: av-debug-collector.py.j2
    dest: /usr/local/bin/av-debug-collector.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart av debug collector

- name: Install PXE debug collector service
  ansible.builtin.template:
    src: av-debug-collector.service.j2
    dest: /etc/systemd/system/av-debug-collector.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart av debug collector

- name: Ensure PXE debug collector service is enabled and running
  ansible.builtin.service:
    name: av-debug-collector
    state: started
    enabled: true

- name: Render PXE server upstream sync helper
  ansible.builtin.template:
    src: sync-from-proxy.sh.j2
    dest: /usr/local/sbin/sync-from-proxy.sh
    owner: root
    group: root
    mode: "0755"

- name: Render scheduled PXE definition refresh helper
  ansible.builtin.template:
    src: pxe-definition-refresh.sh.j2
    dest: /usr/local/sbin/pxe-definition-refresh.sh
    owner: root
    group: root
    mode: "0755"

- name: Render scheduled PXE definition refresh service
  ansible.builtin.template:
    src: pxe-definition-refresh.service.j2
    dest: /etc/systemd/system/pxe-definition-refresh.service
    owner: root
    group: root
    mode: "0644"

- name: Render scheduled PXE definition refresh timer
  ansible.builtin.template:
    src: pxe-definition-refresh.timer.j2
    dest: /etc/systemd/system/pxe-definition-refresh.timer
    owner: root
    group: root
    mode: "0644"

- name: Render scheduled PXE client rebuild helper
  ansible.builtin.template:
    src: pxe-client-rebuild.sh.j2
    dest: /usr/local/sbin/pxe-client-rebuild.sh
    owner: root
    group: root
    mode: "0755"

- name: Render scheduled PXE client rebuild service
  ansible.builtin.template:
    src: pxe-client-rebuild.service.j2
    dest: /etc/systemd/system/pxe-client-rebuild.service
    owner: root
    group: root
    mode: "0644"

- name: Render scheduled PXE client rebuild timer
  ansible.builtin.template:
    src: pxe-client-rebuild.timer.j2
    dest: /etc/systemd/system/pxe-client-rebuild.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable scheduled PXE maintenance timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    daemon_reload: true
    enabled: true
    state: started
  loop:
    - pxe-definition-refresh.timer
    - pxe-client-rebuild.timer

- name: Sync definitions from proxy onto PXE server
  ansible.builtin.command: /usr/local/sbin/sync-from-proxy.sh
  when: pxe_server_sync_from_proxy_now | bool
  register: pxe_server_sync_result
  changed_when: "'Fetched' in pxe_server_sync_result.stdout or 'Published' in pxe_server_sync_result.stdout"

- name: Document PXE server workflow
  ansible.builtin.template:
    src: PXE-SERVER-WORKFLOW.md.j2
    dest: "{{ pxe_server_workspace }}/PXE-SERVER-WORKFLOW.md"
    owner: root
    group: root
    mode: "0644"

- name: Flush pending build VM handlers before staged reboot
  ansible.builtin.meta: flush_handlers
  when: build_vm_pxe_lab_netplan.changed

- name: Reboot build VM to activate staged PXE netplan safely
  ansible.builtin.shell: |
    nohup bash -c 'sleep 2; systemctl reboot' >/dev/null 2>&1 &
  changed_when: true
  when: build_vm_pxe_lab_netplan.changed
