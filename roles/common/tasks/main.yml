---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Render static management netplan
  ansible.builtin.template:
    src: 10-av-management.yaml.j2
    dest: /etc/netplan/10-av-management.yaml
    owner: root
    group: root
    mode: "0644"
  when:
    - av_management_interface is defined
    - av_management_interface_mac is defined
    - av_management_address is defined
    - av_management_gateway is defined
    - av_management_dns_servers is defined
  notify: Apply management netplan

- name: Remove default cloud-init DHCP netplan when static management is defined
  ansible.builtin.file:
    path: /etc/netplan/50-cloud-init.yaml
    state: absent
  when:
    - av_management_interface is defined
    - av_management_interface_mac is defined
    - av_management_address is defined
    - av_management_gateway is defined
    - av_management_dns_servers is defined
  notify: Apply management netplan

- name: Apply management netplan before continuing
  ansible.builtin.meta: flush_handlers
  when:
    - av_management_interface is defined
    - av_management_interface_mac is defined
    - av_management_address is defined
    - av_management_gateway is defined
    - av_management_dns_servers is defined
