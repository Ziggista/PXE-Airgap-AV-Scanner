    group: root
    mode: "0755"

- name: Render live scanner user bootstrap service
  ansible.builtin.template:
    src: av-live-scanner-user.service.j2
    dest: "{{ pxe_client_overlay_root }}/etc/systemd/system/av-live-scanner-user.service"
