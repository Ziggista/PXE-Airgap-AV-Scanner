---
- name: Install PXE client image packages
  ansible.builtin.apt:
    name: "{{ pxe_client_packages }}"
    state: present

- name: Ensure PXE client workspace exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ pxe_client_workspace }}"
    - "{{ pxe_client_output_dir }}"
    - "{{ pxe_client_overlay_root }}"
    - "{{ pxe_client_remaster_root }}"
    - "{{ pxe_client_remaster_extract_root }}"
    - "{{ pxe_client_remaster_edit_root }}"
    - "{{ pxe_client_overlay_root }}/etc/av-pxe"
    - "{{ pxe_client_overlay_root }}/etc/default"
    - "{{ pxe_client_overlay_root }}/etc/gdm3"
    - "{{ pxe_client_overlay_root }}/etc/lightdm/lightdm.conf.d"
    - "{{ pxe_client_overlay_root }}/etc/skel"
    - "{{ pxe_client_overlay_root }}/etc/skel/.config"
    - "{{ pxe_client_overlay_root }}/etc/skel/.local"
    - "{{ pxe_client_overlay_root }}/etc/skel/.local/share"
    - "{{ pxe_client_overlay_root }}/etc/skel/.local/share/applications"
    - "{{ pxe_client_overlay_root }}/etc/systemd/system/getty@tty1.service.d"
    - "{{ pxe_client_overlay_root }}/etc/xdg/autostart"
    - "{{ pxe_client_overlay_root }}/etc/xdg/openbox"
    - "{{ pxe_client_overlay_root }}/etc/systemd/system"
    - "{{ pxe_client_overlay_root }}/etc/systemd/system/multi-user.target.wants"
    - "{{ pxe_client_overlay_root }}/etc/sudoers.d"
    - "{{ pxe_client_overlay_root }}/usr/local/bin"
    - "{{ pxe_client_overlay_root }}/usr/local/sbin"
    - "{{ pxe_client_overlay_root }}/usr/lib/user-setup"
    - "{{ pxe_client_overlay_root }}/opt/av/definitions/clamav"
    - "{{ pxe_client_overlay_root }}{{ pxe_client_vendor_bundle_root }}"
    - "{{ pxe_client_overlay_root }}{{ pxe_client_vendor_bundle_root }}/defender"
    - "{{ pxe_client_overlay_root }}{{ pxe_client_vendor_bundle_root }}/sophos"
    - "{{ pxe_client_overlay_root }}{{ pxe_client_vendor_bundle_root }}/bitdefender"
    - "{{ pxe_client_overlay_root }}/opt/av/rules"

- name: Render PXE client desktop autostart entry
  ansible.builtin.template:
    src: av-network-banner.desktop.j2
    dest: "{{ pxe_client_overlay_root }}/etc/xdg/autostart/av-network-banner.desktop"
    owner: root
    group: root
    mode: "0644"

- name: Render PXE client network warning app
  ansible.builtin.template:
    src: av-network-banner.py.j2
    dest: "{{ pxe_client_overlay_root }}/usr/local/bin/av-network-banner.py"
    owner: root
    group: root
    mode: "0755"

- name: Render PXE client runtime configuration
  ansible.builtin.template:
    src: av-pxe-client.env.j2
    dest: "{{ pxe_client_overlay_root }}/etc/av-pxe/client.env"
    owner: root
    group: root
    mode: "0644"

- name: Render casper live-user configuration
  ansible.builtin.template:
    src: casper.conf.j2
    dest: "{{ pxe_client_overlay_root }}/etc/casper.conf"
    owner: root
    group: root
    mode: "0644"

- name: Render GDM autologin configuration
  ansible.builtin.template:
    src: gdm-custom.conf.j2
    dest: "{{ pxe_client_overlay_root }}/etc/gdm3/custom.conf"
    owner: root
    group: root
    mode: "0644"

- name: Render LightDM autologin configuration
  ansible.builtin.template:
    src: 20-av-client-autologin.conf.j2
    dest: "{{ pxe_client_overlay_root }}/etc/lightdm/lightdm.conf.d/20-av-client-autologin.conf"
    owner: root
    group: root
    mode: "0644"

- name: Render nodm configuration
  ansible.builtin.template:
    src: nodm-default.j2
    dest: "{{ pxe_client_overlay_root }}/etc/default/nodm"
    owner: root
    group: root
    mode: "0644"

- name: Render tty1 autologin override
  ansible.builtin.file:
    dest: "{{ pxe_client_overlay_root }}/etc/systemd/system/getty@tty1.service.d/autologin.conf"
    state: absent

- name: Render scanner bash profile into skel
  ansible.builtin.template:
    src: scanner-bash-profile.j2
    dest: "{{ pxe_client_overlay_root }}/etc/skel/.bash_profile"
    owner: root
    group: root
    mode: "0644"

- name: Render scanner X init profile into skel
  ansible.builtin.template:
    src: scanner-xinitrc.j2
    dest: "{{ pxe_client_overlay_root }}/etc/skel/.xinitrc"
    owner: root
    group: root
    mode: "0755"

- name: Render dedicated kiosk X startup service
  ansible.builtin.template:
    src: av-kiosk-x.service.j2
    dest: "{{ pxe_client_overlay_root }}/etc/systemd/system/av-kiosk-x.service"
    owner: root
    group: root
    mode: "0644"

- name: Enable dedicated kiosk X startup service
  ansible.builtin.file:
    src: ../av-kiosk-x.service
    dest: "{{ pxe_client_overlay_root }}/etc/systemd/system/multi-user.target.wants/av-kiosk-x.service"
    state: link

- name: Render kiosk X client wrapper
  ansible.builtin.template:
    src: start-kiosk-x-client.sh.j2
    dest: "{{ pxe_client_overlay_root }}/usr/local/bin/start-kiosk-x-client.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render kiosk session wrapper
  ansible.builtin.template:
    src: av-kiosk-session.sh.j2
    dest: "{{ pxe_client_overlay_root }}/usr/local/bin/av-kiosk-session.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render network shutdown helper
  ansible.builtin.template:
    src: disable-network-access.sh.j2
    dest: "{{ pxe_client_overlay_root }}/usr/local/bin/disable-network-access.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render Openbox autostart helper
  ansible.builtin.template:
    src: av-openbox-autostart.sh.j2
    dest: "{{ pxe_client_overlay_root }}/usr/local/bin/av-openbox-autostart.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render Openbox autostart configuration
  ansible.builtin.template:
    src: openbox-autostart.j2
    dest: "{{ pxe_client_overlay_root }}/etc/xdg/openbox/autostart"
    owner: root
