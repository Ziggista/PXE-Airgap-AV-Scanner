    dest: "{{ pxe_client_overlay_root }}/etc/systemd/system/multi-user.target.wants/av-definition-sync.service"
    state: link

- name: Render PXE client source media mount helper
  ansible.builtin.template:
    src: mount-public-media.sh.j2
    dest: "{{ pxe_client_overlay_root }}/usr/local/bin/mount-public-media.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render PXE client destination media mount helper
  ansible.builtin.template:
    src: mount-approved-media.sh.j2
    dest: "{{ pxe_client_overlay_root }}/usr/local/bin/mount-approved-media.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render offline scan wrapper
  ansible.builtin.template:
    src: offline-scan.sh.j2
    dest: "{{ pxe_client_overlay_root }}/usr/local/bin/offline-scan.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render approved media copy helper
  ansible.builtin.template:
    src: copy-approved-media.sh.j2
    dest: "{{ pxe_client_overlay_root }}/usr/local/bin/copy-approved-media.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render scan summary generator
  ansible.builtin.copy:
    src: generate-scan-report.py
    dest: "{{ pxe_client_overlay_root }}/usr/local/bin/generate-scan-report.py"
    owner: root
    group: root
    mode: "0755"

- name: Render baseline YARA rules
  ansible.builtin.template:
    src: offline_rules.yar.j2
    dest: "{{ pxe_client_overlay_root }}{{ pxe_client_yara_rules_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Render baseline YARA metadata
  ansible.builtin.template:
    src: offline_rules.meta.json.j2
    dest: "{{ pxe_client_overlay_root }}{{ pxe_client_yara_rules_metadata_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Render staged vendor engine runner
  ansible.builtin.template:
    src: run-staged-engine.py.j2
    dest: "{{ pxe_client_overlay_root }}/usr/local/bin/run-staged-engine.py"
    owner: root
    group: root
    mode: "0755"

- name: Check for staged vendor bundles on the control node
  ansible.builtin.stat:
    path: "{{ pxe_client_vendor_bundle_stage_root }}/{{ item }}"
  delegate_to: localhost
  become: false
  register: pxe_client_vendor_bundle_stage_stats
  loop:
    - defender
    - sophos
    - bitdefender

- name: Copy staged vendor bundles into the PXE overlay
  ansible.builtin.copy:
    src: "{{ pxe_client_vendor_bundle_stage_root }}/{{ item.item }}/"
    dest: "{{ pxe_client_overlay_root }}{{ pxe_client_vendor_bundle_root }}/{{ item.item }}/"
    owner: root
    group: root
    mode: preserve
  when: item.stat.exists and item.stat.isdir
  loop: "{{ pxe_client_vendor_bundle_stage_stats.results }}"

- name: Render PXE client remaster configuration helper
  ansible.builtin.template:
    src: av-pxe-remaster-configure.sh.j2
    dest: "{{ pxe_client_overlay_root }}/usr/local/sbin/av-pxe-remaster-configure.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render live ISO remaster helper
  ansible.builtin.template:
    src: build-pxe-client-image.sh.j2
    dest: "{{ pxe_client_output_dir }}/build-pxe-client-image.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render publish helper
  ansible.builtin.template:
    src: publish-pxe-client-assets.sh.j2
    dest: "{{ pxe_client_output_dir }}/publish-pxe-client-assets.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render ClamAV definition sync helper
  ansible.builtin.template:
    src: sync-clamav-from-proxy.sh.j2
    dest: "{{ pxe_client_output_dir }}/sync-clamav-from-proxy.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render PXE client build notes
  ansible.builtin.template:
    src: BUILDING.md.j2
    dest: "{{ pxe_client_output_dir }}/BUILDING.md"
    owner: root
    group: root
    mode: "0644"

- name: Build and publish PXE client assets
  when: pxe_client_build_now | bool
  block:
    - name: Sync ClamAV definitions from proxy into remaster overlay
      ansible.builtin.command: "{{ pxe_client_output_dir }}/sync-clamav-from-proxy.sh"
      register: pxe_client_sync_result
      changed_when: "'Fetched' in pxe_client_sync_result.stdout"

    - name: Build remastered PXE client desktop ISO
      ansible.builtin.command: "{{ pxe_client_output_dir }}/build-pxe-client-image.sh"
      register: pxe_client_build_result
      changed_when: true

    - name: Publish PXE client boot assets
      ansible.builtin.command: "{{ pxe_client_output_dir }}/publish-pxe-client-assets.sh"
      register: pxe_client_publish_result
      changed_when: true

    - name: Verify published PXE client assets exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ pxe_client_output_iso }}"
        - "{{ pxe_client_publish_dir }}/vmlinuz"
        - "{{ pxe_client_publish_dir }}/initrd"
      register: pxe_client_asset_stats

    - name: Assert published PXE client assets are present
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Expected published PXE asset is missing: {{ item.stat.path }}"
      loop: "{{ pxe_client_asset_stats.results }}"
