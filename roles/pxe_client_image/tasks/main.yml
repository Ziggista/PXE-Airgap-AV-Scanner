---
- name: Install PXE client image packages
  ansible.builtin.apt:
    name: "{{ pxe_client_packages }}"
    state: present

- name: Ensure PXE client workspace exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ pxe_client_workspace }}"
    - "{{ pxe_client_live_root }}"
    - "{{ pxe_client_output_dir }}"
    - "{{ pxe_client_livebuild_root }}"
    - "{{ pxe_client_livebuild_root }}/config"
    - "{{ pxe_client_livebuild_root }}/config/includes.chroot"
    - "{{ pxe_client_livebuild_root }}/config/includes.chroot/etc/lightdm/lightdm.conf.d"
    - "{{ pxe_client_livebuild_root }}/config/includes.chroot/etc/xdg/autostart"
    - "{{ pxe_client_livebuild_root }}/config/includes.chroot/usr/local/bin"
    - "{{ pxe_client_livebuild_root }}/config/includes.chroot/opt/av/definitions/clamav"
    - "{{ pxe_client_livebuild_root }}/config/package-lists"
    - "{{ pxe_client_livebuild_root }}/config/hooks/live"

- name: Render PXE client package list
  ansible.builtin.template:
    src: av-client.list.chroot.j2
    dest: "{{ pxe_client_livebuild_root }}/config/package-lists/av-client.list.chroot"
    owner: root
    group: root
    mode: "0644"

- name: Render PXE client lightdm autologin config
  ansible.builtin.template:
    src: 20-av-client-autologin.conf.j2
    dest: "{{ pxe_client_livebuild_root }}/config/includes.chroot/etc/lightdm/lightdm.conf.d/20-av-client-autologin.conf"
    owner: root
    group: root
    mode: "0644"

- name: Render PXE client desktop autostart entry
  ansible.builtin.template:
    src: av-network-banner.desktop.j2
    dest: "{{ pxe_client_livebuild_root }}/config/includes.chroot/etc/xdg/autostart/av-network-banner.desktop"
    owner: root
    group: root
    mode: "0644"

- name: Render PXE client network warning app
  ansible.builtin.template:
    src: av-network-banner.py.j2
    dest: "{{ pxe_client_livebuild_root }}/config/includes.chroot/usr/local/bin/av-network-banner.py"
    owner: root
    group: root
    mode: "0755"

- name: Render PXE client source media mount helper
  ansible.builtin.template:
    src: mount-public-media.sh.j2
    dest: "{{ pxe_client_livebuild_root }}/config/includes.chroot/usr/local/bin/mount-public-media.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render PXE client destination media mount helper
  ansible.builtin.template:
    src: mount-approved-media.sh.j2
    dest: "{{ pxe_client_livebuild_root }}/config/includes.chroot/usr/local/bin/mount-approved-media.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render offline scan wrapper
  ansible.builtin.template:
    src: offline-scan.sh.j2
    dest: "{{ pxe_client_livebuild_root }}/config/includes.chroot/usr/local/bin/offline-scan.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render live-build config helper
  ansible.builtin.template:
    src: build-pxe-client-image.sh.j2
    dest: "{{ pxe_client_output_dir }}/build-pxe-client-image.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render publish helper
  ansible.builtin.template:
    src: publish-pxe-client-assets.sh.j2
    dest: "{{ pxe_client_output_dir }}/publish-pxe-client-assets.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render ClamAV definition sync helper
  ansible.builtin.template:
    src: sync-clamav-from-proxy.sh.j2
    dest: "{{ pxe_client_output_dir }}/sync-clamav-from-proxy.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render PXE client build notes
  ansible.builtin.template:
    src: BUILDING.md.j2
    dest: "{{ pxe_client_output_dir }}/BUILDING.md"
    owner: root
    group: root
    mode: "0644"

- name: Build and publish PXE client assets
  when: pxe_client_build_now | bool
  block:
    - name: Sync ClamAV definitions from proxy into live-build tree
      ansible.builtin.command: "{{ pxe_client_output_dir }}/sync-clamav-from-proxy.sh"
      register: pxe_client_sync_result
      changed_when: "'Fetched' in pxe_client_sync_result.stdout"

    - name: Build PXE client live image
      ansible.builtin.command: "{{ pxe_client_output_dir }}/build-pxe-client-image.sh"
      args:
        chdir: "{{ pxe_client_livebuild_root }}"
      register: pxe_client_build_result
      changed_when: true

    - name: Publish PXE client boot assets
      ansible.builtin.command: "{{ pxe_client_output_dir }}/publish-pxe-client-assets.sh"
      register: pxe_client_publish_result
      changed_when: true

    - name: Verify published PXE client assets exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ pxe_client_publish_dir }}/vmlinuz"
        - "{{ pxe_client_publish_dir }}/initrd"
        - "{{ pxe_client_publish_dir }}/filesystem.squashfs"
      register: pxe_client_asset_stats

    - name: Assert published PXE client assets are present
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Expected published PXE asset is missing: {{ item.stat.path }}"
      loop: "{{ pxe_client_asset_stats.results }}"
