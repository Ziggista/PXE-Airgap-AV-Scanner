  ansible.builtin.template:
    src: sync-runtime-definitions.sh.j2
    dest: "{{ pxe_client_overlay_root }}/usr/local/bin/sync-runtime-definitions.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render PXE client runtime definition sync service
  ansible.builtin.template:
