    dest: "{{ pxe_client_overlay_root }}/etc/systemd/system/multi-user.target.wants/av-live-scanner-user.service"
    state: link

- name: Render scanner X session profile into skel
  ansible.builtin.template:
    src: scanner-xsession.j2
    dest: "{{ pxe_client_overlay_root }}/etc/skel/.xsession"
    owner: root
    group: root
    mode: "0755"

- name: Render PXE client debug report helper
  ansible.builtin.template:
    src: report-debug-event.sh.j2
    dest: "{{ pxe_client_overlay_root }}/usr/local/bin/report-debug-event.sh"
    owner: root
    group: root
    mode: "0755"

- name: Render PXE client boot debug report service
  ansible.builtin.template:
    src: av-debug-report.service.j2
    dest: "{{ pxe_client_overlay_root }}/etc/systemd/system/av-debug-report.service"
