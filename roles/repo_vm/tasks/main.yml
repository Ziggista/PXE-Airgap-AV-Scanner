---
- name: Assert third-party upstreams are explicitly approved
  ansible.builtin.assert:
    that:
      - repo_vm_allow_third_party_upstreams or (repo_vm_extra_upstreams | length == 0)
    fail_msg: >-
      repo_vm_extra_upstreams is non-empty but repo_vm_allow_third_party_upstreams
      is false. Review and explicit approval are required before adding non-Ubuntu
      or non-default upstream feeds.

- name: Install repository VM packages
  ansible.builtin.apt:
    name: "{{ repo_vm_packages }}"
    state: present

- name: Ensure repository directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ aptly_root_dir }}"
    - "{{ aptly_public_dir }}"
    - "{{ artifact_root }}"
    - "{{ repo_root }}"
    - "{{ repo_root }}/docs"
    - "{{ repo_vm_definitions_root }}"
    - "{{ repo_vm_clamav_root }}"

- name: Ensure ClamAV definition directory permissions
  ansible.builtin.file:
    path: "{{ repo_vm_clamav_root }}"
    state: directory
    owner: clamav
    group: clamav
    mode: "0755"

- name: Render aptly configuration
  ansible.builtin.template:
    src: aptly.conf.j2
    dest: /etc/aptly.conf
    owner: root
    group: root
    mode: "0644"

- name: Render nginx site for published repositories
  ansible.builtin.template:
    src: nginx-av-repo.conf.j2
    dest: /etc/nginx/sites-available/av-repo.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable nginx repo site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/av-repo.conf
    dest: /etc/nginx/sites-enabled/av-repo.conf
    state: link
  notify: Reload nginx

- name: Disable default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Document mirror commands
  ansible.builtin.template:
    src: MIRRORING.md.j2
    dest: "{{ repo_root }}/docs/repo-vm-mirroring.md"
    owner: root
    group: root
    mode: "0644"

- name: Document approved upstreams
  ansible.builtin.template:
    src: APPROVED-UPSTREAMS.md.j2
    dest: "{{ repo_root }}/docs/approved-upstreams.md"
    owner: root
    group: root
    mode: "0644"

- name: Render ClamAV definition sync helper
  ansible.builtin.template:
    src: sync-clamav-definitions.sh.j2
    dest: /usr/local/sbin/sync-clamav-definitions.sh
    owner: root
    group: root
    mode: "0755"

- name: Stop background freshclam service before manual sync
  ansible.builtin.service:
    name: clamav-freshclam
    state: stopped
    enabled: false
  failed_when: false

- name: Refresh ClamAV definitions on proxy node
  ansible.builtin.command: /usr/local/sbin/sync-clamav-definitions.sh
  register: clamav_sync_result
  changed_when: >
    'updated' in (clamav_sync_result.stdout | lower) or
    'downloaded' in (clamav_sync_result.stdout | lower) or
    'updated' in (clamav_sync_result.stderr | lower) or
    'downloaded' in (clamav_sync_result.stderr | lower)
