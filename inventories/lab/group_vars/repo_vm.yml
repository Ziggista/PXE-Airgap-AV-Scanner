---
aptly_root_dir: /srv/aptly
aptly_publish_endpoint: "filesystem:public:"
aptly_public_dir: /srv/aptly/public
repo_vm_data_root: /srv/av-pxe
repo_vm_definitions_root: "{{ repo_vm_data_root }}/definitions"
repo_vm_clamav_root: "{{ repo_vm_definitions_root }}/clamav"
repo_vm_allow_third_party_upstreams: false
repo_vm_extra_upstreams: []
repo_vm_approved_upstreams:
  - name: ubuntu-archive
    url: http://archive.ubuntu.com/ubuntu
    purpose: Ubuntu base archive
  - name: ubuntu-security
    url: http://security.ubuntu.com/ubuntu
    purpose: Ubuntu security updates
  - name: clamav-db
    url: https://database.clamav.net
    purpose: ClamAV signature database sync
aptly_mirrors:
  - name: "ubuntu-{{ ubuntu_release }}-main"
    archive_url: http://archive.ubuntu.com/ubuntu
    distribution: "{{ ubuntu_codename }}"
    components: [main, universe]
  - name: "ubuntu-{{ ubuntu_release }}-updates"
    archive_url: http://archive.ubuntu.com/ubuntu
    distribution: "{{ ubuntu_codename }}-updates"
    components: [main, universe]
  - name: "ubuntu-{{ ubuntu_release }}-security"
    archive_url: http://security.ubuntu.com/ubuntu
    distribution: "{{ ubuntu_codename }}-security"
    components: [main, universe]

repo_vm_packages:
  - aptly
  - clamav-freshclam
  - nginx
